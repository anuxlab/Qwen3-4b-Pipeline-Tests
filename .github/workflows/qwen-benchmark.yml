name: Qwen end-to-end benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated Ollama model tags; each tag runs on its own matrix runner'
        required: true
        default: 'qwen3:0.6b,qwen3:1.7b,qwen3:4b,qwen3:4b-q8_0'
        type: string
      contexts:
        description: 'Context settings, comma-separated'
        required: true
        default: '512,1024,2048,4096,8192'
        type: string
      input_targets:
        description: 'Approximate input token targets, comma-separated'
        required: true
        default: '128,512,1024,2048,4096'
        type: string
      output_limits:
        description: 'Maximum output tokens, comma-separated'
        required: true
        default: '32,128,512'
        type: string
      repeats:
        description: 'Repeated trials per case (>=2 recommended)'
        required: true
        default: '2'
        type: string
      max_cases_per_model:
        description: 'Optional cap on matrix combinations for smoke testing; 0 means exhaustive'
        required: true
        default: '0'
        type: string
  workflow_call:
    inputs:
      models: { required: false, type: string, default: 'qwen3:0.6b,qwen3:1.7b,qwen3:4b,qwen3:4b-q8_0' }
      contexts: { required: false, type: string, default: '512,1024,2048,4096,8192' }
      input_targets: { required: false, type: string, default: '128,512,1024,2048,4096' }
      output_limits: { required: false, type: string, default: '32,128,512' }
      repeats: { required: false, type: string, default: '2' }
      max_cases_per_model: { required: false, type: string, default: '0' }

permissions:
  contents: read

concurrency:
  group: qwen-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare model matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      models: ${{ steps.matrix.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Validate code before scheduling model jobs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q scripts tests
          python -m pytest -q
      - id: matrix
        name: Build one-runner-per-model matrix
        env:
          MODELS: ${{ inputs.models || 'qwen3:0.6b,qwen3:1.7b,qwen3:4b,qwen3:4b-q8_0' }}
        run: python scripts/build_matrix.py --models "$MODELS" --output "$GITHUB_OUTPUT"

  benchmark:
    name: Benchmark ${{ matrix.model }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # GitHub schedules each matrix entry on a separate runner. Omit max-parallel
      # so all variants can run concurrently, subject to repository/account limits.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      MODEL: ${{ matrix.model }}
      SAFE_MODEL: ${{ matrix.safe_name }}
      CONTEXTS: ${{ inputs.contexts || '512,1024,2048,4096,8192' }}
      INPUT_TARGETS: ${{ inputs.input_targets || '128,512,1024,2048,4096' }}
      OUTPUT_LIMITS: ${{ inputs.output_limits || '32,128,512' }}
      REPEATS: ${{ inputs.repeats || '2' }}
      MAX_CASES: ${{ inputs.max_cases_per_model || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'requests>=2.31,<3' 'psutil>=5.9,<7'
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start or reuse Ollama service
        shell: bash
        run: |
          mkdir -p results
          if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo 'Ollama is already listening on port 11434; reusing it.'
          else
            (ollama serve > ollama.log 2>&1 &)
          fi
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:11434/api/version || true
              exit 0
            fi
            sleep 2
          done
          cat ollama.log || true
          exit 1
      - name: Pull and benchmark this model only
        id: run_model
        shell: bash
        run: |
          set +e
          echo "This runner is assigned to exactly one model: $MODEL"
          ollama pull "$MODEL"
          pull_rc=$?
          if [[ "$pull_rc" -ne 0 ]]; then
            MODEL="$MODEL" OUT="results/${SAFE_MODEL}.json" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {'schema_version': 3, 'timestamp_utc': datetime.now(timezone.utc).isoformat(),
                     'method': 'ollama_chat', 'model': os.environ['MODEL'],
                     'model_info': {'metadata_error': 'model pull failed'},
                     'results': [{'case_id': 'model_pull', 'kind': 'setup', 'status': 'error',
                                  'error': 'ollama pull failed: verify model tag and runner network'}]}
          with open(os.environ['OUT'], 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          PY
            echo 'failed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/bench_ollama.py \
            --model "$MODEL" --contexts "$CONTEXTS" \
            --input-targets "$INPUT_TARGETS" --output-limits "$OUTPUT_LIMITS" \
            --repeats "$REPEATS" --max-cases "$MAX_CASES" \
            --output-json "results/${SAFE_MODEL}.json"
          rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "Benchmark runner exited with code $rc"
            if [[ ! -s "results/${SAFE_MODEL}.json" ]]; then
              MODEL="$MODEL" OUT="results/${SAFE_MODEL}.json" RC="$rc" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {'schema_version': 3, 'timestamp_utc': datetime.now(timezone.utc).isoformat(),
                     'method': 'ollama_chat', 'model': os.environ['MODEL'], 'model_info': {},
                     'results': [{'case_id': 'benchmark_process', 'kind': 'setup', 'status': 'error',
                                  'error': 'benchmark process failed with exit code ' + os.environ['RC']}]}
          with open(os.environ['OUT'], 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
          PY
            fi
            echo 'failed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'failed=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Collect runner diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p results
          if [[ -f ollama.log ]]; then cp ollama.log "results/${SAFE_MODEL}.ollama.log"; fi
      - name: Upload this model's raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-model-${{ github.run_id }}-${{ matrix.safe_name }}
          path: |
            results/${{ matrix.safe_name }}.json
            results/${{ matrix.safe_name }}.ollama.log
          if-no-files-found: warn
          retention-days: 90
      - name: Mark this model job failed if pull or benchmark failed
        if: always() && steps.run_model.outputs.failed == 'true'
        run: exit 1

  aggregate:
    name: Aggregate all model results
    needs: [prepare, benchmark]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download every model artifact
        uses: actions/download-artifact@v4
        with:
          pattern: qwen-model-${{ github.run_id }}-*
          path: results
          merge-multiple: true
      - name: Record expected model variants
        env:
          EXPECTED_MODELS: ${{ needs.prepare.outputs.models }}
        run: |
          python - <<'PY'
          import json, os
          models = json.loads(os.environ['EXPECTED_MODELS'])
          with open('expected-models.json', 'w', encoding='utf-8') as f:
              json.dump({'models': models}, f, indent=2)
          print(f'Expected {len(models)} model result files: {models}')
          PY
      - name: Generate consolidated Markdown and JSON summary
        if: always()
        run: |
          python scripts/summarize_results.py \
            --input-dir results \
            --expected-models expected-models.json \
            --json-out benchmark-summary.json \
            --md-out BENCHMARK_SUMMARY.md
      - name: Upload consolidated report and all collected results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-benchmark-summary-${{ github.run_id }}
          path: |
            results/
            expected-models.json
            benchmark-summary.json
            BENCHMARK_SUMMARY.md
          if-no-files-found: warn
          retention-days: 90
      - name: Fail aggregate job if any model failed or result is missing
        if: always()
        env:
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: |
          python - <<'PY'
          import json, os, sys
          summary = json.load(open('benchmark-summary.json', encoding='utf-8')) if os.path.exists('benchmark-summary.json') else {}
          bad = os.environ.get('BENCHMARK_RESULT') != 'success' or bool(summary.get('missing_models'))
          if bad:
              print('At least one model job failed or expected model results are missing.')
              print('Missing models:', summary.get('missing_models', []))
              sys.exit(1)
          print('All expected model variants produced result files.')
          PY
