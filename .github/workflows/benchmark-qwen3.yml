name: Benchmark Qwen3-4B Variants
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - method: "ollama"
            model_tag: "qwen3:4b"
          - method: "ollama"
            model_tag: "qwen3:4b-q4_K_M"
          - method: "llamacpp"
            quant: "Q4_K_M"
            gguf_repo: "bartowski/Qwen_Qwen3-4B-GGUF"
          - method: "llamacpp"
            quant: "Q5_K_M"
            gguf_repo: "bartowski/Qwen_Qwen3-4B-GGUF"
          - method: "llamacpp"
            quant: "Q8_0"
            gguf_repo: "bartowski/Qwen_Qwen3-4B-GGUF"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- OLLAMA DEPENDENCIES ----
      - name: Install Ollama-side dependencies
        if: matrix.method == 'ollama'
        run: pip install psutil

      # ---- LLAMACPP DEPENDENCIES ----
      - name: Install llama.cpp dependencies
        if: matrix.method == 'llamacpp'
        run: |
          python -m pip install --upgrade pip
          # llama-cpp-python has prebuilt wheels on ubuntu-latest (x86_64)
          pip install llama-cpp-python psutil huggingface_hub

      # ---- OLLAMA BRANCH ----
      - name: Run Ollama Benchmark
        if: matrix.method == 'ollama'
        id: ollama
        uses: ai-action/ollama-action@v2
        with:
          model: ${{ matrix.model_tag }}
          prompt: "Explain the significance of the Turing Test in 50 words."
          cache: true

      - name: Write Ollama result.json
        if: matrix.method == 'ollama'
        run: |
          RESPONSE='${{ steps.ollama.outputs.response }}'
          cat > result.json <<EOF
          {
            "method": "ollama",
            "model": "${{ matrix.model_tag }}",
            "response_length": ${#RESPONSE},
            "response_excerpt": "${RESPONSE:0:200}"
          }
          EOF
          echo "--- result.json ---"; cat result.json

      # ---- LLAMA.CPP BRANCH ----
      - name: Restore GGUF cache
        if: matrix.method == 'llamacpp'
        id: cache                       # ← CHANGE 1: required for outputs
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-gguf-${{ matrix.quant }}-v1
          path: ./models
          restore-keys: |
            ${{ runner.os }}-gguf-

      - name: Download GGUF (cache miss)
        if: matrix.method == 'llamacpp' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          # CHANGE 2: use `hf` CLI with a wildcard — resilient to filename variations
          hf download "${{ matrix.gguf_repo }}" \
            --include "*${{ matrix.quant }}.gguf" \
            --local-dir ./models
          ls -lh ./models

      - name: Run llama.cpp Benchmark
        if: matrix.method == 'llamacpp'
        run: |
          # CHANGE 7 safety net: resolve actual filename
          MODEL_FILE=$(ls ./models/*${{ matrix.quant }}.gguf | head -n1)
          echo "Using model: $MODEL_FILE"
          python scripts/bench_llamacpp.py \
            --model-path "$MODEL_FILE" \
            --prompt "Explain the significance of the Turing Test in 50 words." \
            --n-threads 4 \
            --output-json result.json

      - name: Upload Benchmark Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.method }}-${{ matrix.model_tag || matrix.quant }}
          path: result.json